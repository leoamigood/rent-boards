# Publish docs/ to GitHub Pages.
#
# The boards are built locally (tools/build_pages.py) and committed under docs/,
# because the listing databases are gitignored and never leave the laptop — CI
# has no data to build from. This workflow only uploads what is committed; the
# basemap tiles come from OpenStreetMap and need no credential.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
